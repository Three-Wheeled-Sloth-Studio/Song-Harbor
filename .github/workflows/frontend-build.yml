name: Frontend build
on:
  push:
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend-build.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --prefix app/frontend
      - name: Typecheck and bundle
        run: npm run build --prefix app/frontend
      - name: Verify automatic stereo balance constraints
        run: node --test app/frontend/tests/auto-pan.test.mjs
      - name: Verify frequency-selective de-esser against synthetic audio
        run: node --test app/frontend/tests/section-deess.test.mjs
      - name: Verify sound cleanup and attack-rise diagnostics
        run: node --experimental-strip-types --test app/frontend/tests/audio-cleanup.test.mjs app/frontend/tests/attack-rise.test.mjs
      - name: Install Chromium smoke dependencies
        run: |
          npm install --prefix app/frontend --no-save playwright
          cd app/frontend && npx playwright install --with-deps chromium
      - name: Verify application renders in Chromium
        run: node app/frontend/scripts/browser-smoke.mjs
      - name: Install minimal local API dependencies
        run: python3 -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30" "python-multipart>=0.0.9" "pydantic>=2,<3"
      - name: Verify Chromium renders from real FastAPI server
        run: node app/frontend/scripts/browser-smoke.mjs --backend
