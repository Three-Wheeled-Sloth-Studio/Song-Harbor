name: Song projects and Waveform exchange
on:
  push:
    paths:
      - 'app/backend/**'
      - '.github/workflows/projects-tests.yml'
  pull_request:
    paths:
      - 'app/backend/**'
      - '.github/workflows/projects-tests.yml'
# Keep only the latest check for each branch while commits are landing rapidly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  projects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API route test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "python-multipart>=0.0.9" "uvicorn>=0.30" "numpy>=1.26,<3"
      - name: Check all backend Python source syntax
        run: python -m compileall -q app/backend
      - name: Run maintained backend regression suites
        shell: bash
        run: |
          set -euo pipefail
          # Separate Python processes preserve test isolation.
          patterns=(
            test_instrument_library.py
            test_bass_midi.py
            test_lyric_captions.py
            test_multiline_section_production.py
            test_spatial_evolution.py
            test_child_channel_scripting.py
            test_track_lifecycle.py
            test_section_production.py
            test_runtime_quit.py
            test_version_badge.py
            test_section_deess.py
            test_section_dynamics.py
            test_stem_import.py
            test_projects.py
            test_library.py
            test_library_routes.py
            test_daw.py
            test_audacity_handoff.py
            test_ace_adapter.py
            test_ace_candidates.py
            test_ace_install.py
            test_ace_isolation.py
            test_ace_lego_transport.py
            test_ace_locations.py
            test_ace_service.py
            test_ace_transport.py
            test_channel_split.py
            test_declick_recipes.py
            test_dependencies.py
            test_duration_recovery.py
            test_duration_validation.py
            test_instrument_generation.py
            test_mix_validation.py
            test_production_cues.py
            test_section_auto_pan.py
            test_section_gain.py
            test_section_import.py
            test_sections.py
            test_spectral_cleanup_directives.py
            test_track_routing.py
            test_waveform_peaks.py
            test_workspace_settings.py
          )
          failures=()
          for pattern in "${patterns[@]}"; do
            echo "::group::${pattern}"
            if ! python -m unittest discover -s app/backend/tests -p "${pattern}" -v; then
              failures+=("${pattern}")
            fi
            echo "::endgroup::"
          done
          if (( ${#failures[@]} > 0 )); then
            printf 'Failed test modules: %s\\n' "${failures[*]}"
            exit 1
          fi
