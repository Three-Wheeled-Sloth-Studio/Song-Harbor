name: Song projects and Waveform exchange
on:
  push:
    paths:
      - 'app/backend/**'
      - '.github/workflows/projects-tests.yml'
  pull_request:
    paths:
      - 'app/backend/**'
      - '.github/workflows/projects-tests.yml'
jobs:
  projects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API route test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "python-multipart>=0.0.9" "uvicorn>=0.30"
      - name: Check Python source syntax
        run: python -m py_compile app/backend/server.py app/backend/projects.py app/backend/dependencies.py app/backend/daw.py app/backend/audacity_handoff.py app/backend/library.py app/backend/stem_import.py
      - name: Verify two-line section production notation
        run: python -m unittest discover -s app/backend/tests -p 'test_section_production.py' -v
      - name: Verify local quit endpoint safety
        run: python -m unittest discover -s app/backend/tests -p 'test_runtime_quit.py' -v
      - name: Verify human-readable Version Revision Build format
        run: python -m unittest discover -s app/backend/tests -p 'test_version_badge.py' -v
      - name: Verify section de-esser parsing and roundtrip
        run: python -m unittest discover -s app/backend/tests -p 'test_section_deess.py' -v
      - name: Verify dynamics scripts
        run: python -m unittest discover -s app/backend/tests -p 'test_section_dynamics.py' -v
      - name: Verify externally imported tracks and title inference
        run: python -m unittest discover -s app/backend/tests -p 'test_stem_import.py' -v
      - name: Verify project recovery and DAW exchange
        run: python -m unittest discover -s app/backend/tests -p 'test_projects.py' -v
      - name: Verify SQLite Library adoption and safe rename
        run: python -m unittest discover -s app/backend/tests -p 'test_library.py' -v
      - name: Verify live HTTP Library actions
        run: python -m unittest discover -s app/backend/tests -p 'test_library_routes.py' -v
      - name: Verify DAW target discovery and exchange
        run: python -m unittest discover -s app/backend/tests -p 'test_daw.py' -v
      - name: Verify Audacity six-stem launch and guarded import
        run: python -m unittest discover -s app/backend/tests -p 'test_audacity_handoff.py' -v
