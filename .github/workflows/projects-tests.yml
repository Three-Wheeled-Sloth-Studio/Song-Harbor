name: Song projects and Waveform exchange
on:
  push:
    paths:
      - 'app/backend/**'
      - '.github/workflows/projects-tests.yml'
  pull_request:
    paths:
      - 'app/backend/**'
      - '.github/workflows/projects-tests.yml'
jobs:
  projects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python source syntax
        run: python -m py_compile app/backend/server.py app/backend/projects.py app/backend/dependencies.py
      - name: Verify persistence and DAW export without CUDA
        run: python -m unittest discover -s app/backend/tests -p 'test_projects.py' -v
