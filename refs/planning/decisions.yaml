version: 1
schema: refs/schemas/schemaRegistry.yaml
updated: 2026-10-16
decisions:
  - id: SH-DEC-001
    status: accepted
    date: 2026-10-16
    decision: TWS Studios is the parent brand; Song Harbor is the locked working project and repository name.
    rationale: Name fits the TWS naming family while allowing separate component identities.
    consequences:
      - Working title is not trademark clearance or a final public product name.
  - id: SH-DEC-002
    status: accepted
    date: 2026-10-16
    decision: The product and branding are independent of Infra Choir.
    rationale: The digital band is a product consumer, not a co-brand or cross-promotion.
    consequences:
      - Avoid hard-coded artist identities and band-specific marketing.
  - id: SH-DEC-003
    status: accepted
    date: 2026-10-16
    decision: Local generation and a standalone end-user app are required; RTX 4070 12 GB VRAM and 96 GB RAM are the reference workstation.
    rationale: Viability on established consumer hardware and independent distribution are core requirements.
    consequences:
      - Benchmark local jobs and define graceful lower/higher compute profiles.
  - id: SH-DEC-004
    status: accepted
    date: 2026-10-16
    decision: Product requirements include section-level and stem-level direction, generation and output; interchangeable models; plug-ins, LoRA and LoKr; remix/cover; and song/stem ingestion and reconstruction.
    rationale: These are explicit user requirements, not an assertion that current models satisfy them.
    consequences:
      - Feasibility spikes must test genuine edit isolation and interchange.
  - id: SH-DEC-005
    status: accepted
    date: 2026-10-16
    decision: Cloud execution and training are future capabilities, not MVP requirements.
    rationale: Keep first implementation local and focused while retaining extension paths.
    consequences:
      - Define provider and adapter interfaces without building cloud or training UI yet.
  - id: SH-DEC-006
    status: accepted
    date: 2026-10-16
    decision: Align project documentation and agent handoffs with the Agent Academy refs conventions.
    rationale: Consistent durable, auditable memory across TWS Studios repositories.
    consequences:
      - Keep accepted decisions, roadmap, open questions and handoffs under refs.
  - id: SH-DEC-007
    status: proposed
    date: 2026-10-16
    decision: Use a model-neutral Music Arrangement Graph and capability-aware adapter orchestration.
    rationale: Prevent a single generation model from dictating composition storage and supported operations.
    consequences:
      - Design versioned schema and perform model interoperability prototypes before locking representation.
  - id: SH-DEC-008
    status: proposed
    date: 2026-10-16
    decision: Consider Second Take, Track Yard, Pocket Producer, and Patch Bay as potential component names.
    rationale: Enables product family hierarchy similar to Parchment Worlds and World Forge.
    consequences:
      - Names, module boundaries, and legal checks remain open.
  - id: SH-DEC-009
    status: accepted
    date: 2026-10-16
    decision: Deliver generation-first; establish native composition and generation workflows before productionizing import, reconstruction, covers, and remixes.
    rationale: Imported music cannot be meaningfully reconstructed and revised against Song Harbor's native workflow until generation and selective editing capabilities exist to receive it.
    consequences:
      - The first standalone release is generation-first, not import-and-remix complete.
      - Early import and separation experiments are permitted as exploratory spikes, not release-gating implementation.
      - Existing-track reconstruction and guided remix remain required subsequent product capabilities.
      - Prioritize generation, section/track control, selective revision, offline packaging, then reconstruction and remix.
  - id: SH-DEC-010
    status: accepted
    date: 2026-10-17
    decision: Deliver a reusable local stem separator as the first functional Song Harbor deliverable, preceding the generation workbench.
    rationale: Provides immediate mastering value for existing recordings and a separable capability needed by the eventual music production platform.
    consequences:
      - Preserve SH-DEC-009 generation-first sequencing for full native production and the first comprehensive application release.
      - Implement separation as a focused standalone-compatible utility/worker, not full imported-song reconstruction.
      - Begin license and 12 GB benchmark discovery with python-audio-separator, Demucs and other compatible engines.
      - Keep exported separated stems explicitly distinguished from genuinely independently generated stems.
